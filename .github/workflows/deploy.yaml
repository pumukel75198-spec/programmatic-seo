name: Deploy

on:
  push:
    branches:
      - main
    # Reine Newsletter-/Manifest-Commits sollen keinen Deploy auslösen und
    # den Deploy des eigentlichen Content-Commits nicht verdrängen.
    paths-ignore:
      - "src/data/newsletter-state.json"
      - "src/data/kv-manifest.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-build-deploy:
    name: Validate, build & deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Re-validates every stored workflow/API with the real validator.
      # Live link checks are off: the disclaimer only guarantees reachability
      # on the day of generation. A stale record blocks the deploy.
      - name: Content gate (stored workflows & APIs)
        run: python -m pipeline.content_gate

      - name: Content quality audit
        run: npm run content:audit

      - name: Dependency audit (production)
        run: npm run security:audit

      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Check monetization configuration
        env:
          PUBLIC_LEMON_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_CHECKOUT_URL }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_BEGINNER: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_BEGINNER }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_INTERMEDIATE: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_INTERMEDIATE }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_ADVANCED: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_ADVANCED }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_EXPERT: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_EXPERT }}
          PUBLIC_LEMON_SCRIPT_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_SCRIPT_CHECKOUT_URL }}
          PUBLIC_LEMON_PLAYBOOK_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_PLAYBOOK_CHECKOUT_URL }}
        # Solange Lemon Squeezy noch nicht freigeschaltet ist, darf die
        # fehlende Checkout-Konfiguration den Deploy nicht blockieren.
        run: npm run monetization:check:warn

      - name: Build Astro project
        env:
          PUBLIC_VISITOR_COUNTER_URL: ${{ vars.PUBLIC_VISITOR_COUNTER_URL || 'https://flowmatrix-visitor-counter.pumukel75198.workers.dev' }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_DOWNLOAD_GATE_URL: ${{ vars.PUBLIC_DOWNLOAD_GATE_URL || 'https://flowmatrix-download-gate.pumukel75198.workers.dev' }}
          PUBLIC_LEMON_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_CHECKOUT_URL }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_BEGINNER: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_BEGINNER }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_INTERMEDIATE: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_INTERMEDIATE }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_ADVANCED: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_ADVANCED }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_EXPERT: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_EXPERT }}
          PUBLIC_LEMON_SCRIPT_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_SCRIPT_CHECKOUT_URL }}
          PUBLIC_NEWSLETTER_URL: ${{ vars.PUBLIC_NEWSLETTER_URL }}
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=programmatic-seo --branch=main

      - name: Submit URLs to IndexNow
        env:
          SITE_URL: https://flowmatrix.dev
          INDEXNOW_KEY: f7c3a9e2b1d84f6a9c0e5d2b8a4f1c73
        run: node scripts/indexnow.mjs
