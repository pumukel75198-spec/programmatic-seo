name: Generate Content Batch

# Alle 3 Tage um 06:00 UTC: zufällig ~10 neue Einträge
# (APIs, Alternatives, Workflows) inkl. PDFs, Python-Skripten,
# strenger Validierung, KV-Upload und Commit.
#
# WICHTIG: Dieser Workflow deployt NICHT selbst. Er generiert, prüft
# (Daten, Typen, Format, Unit-Tests, API-Skripte, Build) und committet
# erst danach. Der eigentliche Deploy läuft ausschließlich über
# deploy.yaml – also erst, wenn alle Tests grün sind.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch
  cancel-in-progress: false

jobs:
  generate:
    name: Generate, validate & commit
    runs-on: ubuntu-latest
    # Schutz gegen hängende Läufe: Batch dauert i. d. R. 6–15 Min.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run unified pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PDF_KV_NAMESPACE_ID: 60b777e050ae4134bf22d3ef1b6a5a5e
          PUBLIC_VISITOR_COUNTER_URL: ${{ vars.PUBLIC_VISITOR_COUNTER_URL || 'https://flowmatrix-visitor-counter.pumukel75198.workers.dev' }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
          PUBLIC_DOWNLOAD_GATE_URL: ${{ vars.PUBLIC_DOWNLOAD_GATE_URL || 'https://flowmatrix-download-gate.pumukel75198.workers.dev' }}
          PUBLIC_LEMON_SCRIPT_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_SCRIPT_CHECKOUT_URL }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_BEGINNER: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_BEGINNER }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_INTERMEDIATE: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_INTERMEDIATE }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_ADVANCED: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_ADVANCED }}
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_EXPERT: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_EXPERT }}
          PUBLIC_LEMON_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_CHECKOUT_URL }}
          PUBLIC_NEWSLETTER_URL: ${{ vars.PUBLIC_NEWSLETTER_URL }}
        run: python -m pipeline.run_batch --workflows 4 --apis 4 --alternatives 3 --skip-deploy

      # Generierte JSON-Dateien Prettier-konform formatieren, damit der
      # Format-Check im Deploy-Workflow nicht fehlschlägt.
      - name: Format generated data
        run: npx prettier --write src/data

      - name: Content quality audit
        run: npm run content:audit

      # --- Qualitäts-Gates ---------------------------------------------------
      # Erst wenn diese Schritte grün sind, wird committet. Der Deploy erfolgt
      # danach über deploy.yaml (Push auf main) mit zusätzlichem Build und
      # E2E-Tests. Schlägt ein Gate fehl, wird nichts gepusht und nichts
      # deployt.
      - name: Type check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      # --- Customer audit & auto-heal (hard pre-deploy gate) ----------------
      # Runs the full six-level customer audit (PDF/ZIP cross-check, sandbox
      # execution, deep PDF inspection, live domains, autonomous healing)
      # BEFORE anything is committed or deployed. A non-zero exit code aborts
      # the job, so a failing product can never reach production.
      # ``--r2-only-healed`` keeps CI fast: the new artifacts were already
      # uploaded by run_batch, so only healed packages need a re-upload.
      - name: Customer audit & auto-heal (pre-deploy gate)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m pipeline.customer_audit_healer --skip-git --r2-only-healed

      - name: Commit new content
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data public/og public/_redirects CUSTOMER_AUDIT_REPORT.md
          # kv-manifest.json wird vom deploy-download-gate-Workflow verwaltet.
          # Ein Commit hier führt zu Rebase-Konflikten mit jenem Workflow.
          git reset --quiet -- src/data/kv-manifest.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new content to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-generate content batch"
            # Vor dem Push Remote-Stand einrebase, um Race-Conditions
            # mit parallelen Pushes zu vermeiden (Auto-Stash schützt lokale Änderungen).
            git pull --rebase --autostash origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Wichtig: Ein Push mit dem Standard-GITHUB_TOKEN löst keine weiteren
      # Workflows aus (Anti-Rekursion). Deshalb deployt der Batch nach Commit
      # und allen erfolgreichen Gates selbst.
      - name: Deploy to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=programmatic-seo --branch=main

      - name: Submit URLs to IndexNow
        if: steps.commit.outputs.changed == 'true'
        env:
          SITE_URL: https://flowmatrix.dev
          INDEXNOW_KEY: f7c3a9e2b1d84f6a9c0e5d2b8a4f1c73
        run: node scripts/indexnow.mjs

      # Nach jedem Content-Batch automatisch einen Newsletter mit den neuen
      # Inhalten versenden (nur wenn es tatsächlich neue Einträge gibt).
      - name: Send newsletter
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ vars.MAILERLITE_GROUP_ID }}
          MAILERLITE_FROM_EMAIL: ${{ vars.MAILERLITE_FROM_EMAIL }}
          MAILERLITE_FROM_NAME: ${{ vars.MAILERLITE_FROM_NAME || 'FlowMatrix' }}
          SITE_URL: https://flowmatrix.dev
        run: node scripts/send-newsletter.mjs

      - name: Commit newsletter state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/newsletter-state.json
          if git diff --cached --quiet; then
            echo "No newsletter state change."
          else
            git commit -m "chore: update newsletter state [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
