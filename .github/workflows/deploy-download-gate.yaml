name: Deploy Download Gate

"on":
  push:
    branches:
      - main
    paths:
      - "worker/download-gate/**"
      - "scripts/generate-pdfs.mjs"
      - "scripts/upload-pdfs.mjs"
      - "src/data/workflows.json"
      - "src/data/partner.json"
      - "src/data/monetization.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build PDFs, deploy worker & upload to KV
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate premium PDFs
        env:
          PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_WORKFLOW_CHECKOUT_URL }}
          PUBLIC_LEMON_CHECKOUT_URL: ${{ vars.PUBLIC_LEMON_CHECKOUT_URL }}
        run: npm run pdf:generate

      - name: Deploy download-gate worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/download-gate
          command: deploy

      - name: Upload PDFs to KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PDF_KV_NAMESPACE_ID: 60b777e050ae4134bf22d3ef1b6a5a5e
        run: npm run pdf:upload
