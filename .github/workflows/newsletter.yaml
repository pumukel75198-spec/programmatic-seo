name: Auto Newsletter

# Wöchentlich (Montag 08:00 UTC): wartende KV-Anmeldungen zu MailerLite
# übertragen und – falls neue Inhalte existieren – automatisch einen
# Newsletter bauen und versenden. Kein manueller Eingriff nötig.
on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    name: Sync subscribers & send newsletter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync pending subscribers to MailerLite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEWSLETTER_KV_NAMESPACE_ID: ${{ vars.NEWSLETTER_KV_NAMESPACE_ID }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ vars.MAILERLITE_GROUP_ID }}
        run: node scripts/sync-newsletter.mjs

      - name: Send newsletter
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAILERLITE_GROUP_ID: ${{ vars.MAILERLITE_GROUP_ID }}
          MAILERLITE_FROM_EMAIL: ${{ vars.MAILERLITE_FROM_EMAIL }}
          MAILERLITE_FROM_NAME: ${{ vars.MAILERLITE_FROM_NAME || 'FlowMatrix' }}
          SITE_URL: https://flowmatrix.dev
        run: node scripts/send-newsletter.mjs

      - name: Commit newsletter state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/newsletter-state.json
          if git diff --cached --quiet; then
            echo "No newsletter state change."
          else
            git commit -m "chore: update newsletter state"
            git pull --rebase --autostash origin main
            git push
          fi
