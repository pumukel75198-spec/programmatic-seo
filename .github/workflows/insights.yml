name: Generate Insights

# Läuft exakt zu 00:00, 06:00, 12:00 und 18:00 Uhr UTC.
# GitHub Actions interpretiert Cron-Ausdrücke immer in UTC.
on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insights-generator
  cancel-in-progress: false

jobs:
  generate:
    name: Fetch feeds, generate articles & commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate insights
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-4o-mini' }}
        run: npm run insights:generate -- --limit=4

      - name: Validate data
        run: npm run validate

      - name: Build Astro project
        run: npm run build

      - name: Commit new insights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/insights.json
          if git diff --cached --quiet; then
            echo "No new insights to commit."
          else
            git commit -m "chore: add generated insights"
            git push
          fi
